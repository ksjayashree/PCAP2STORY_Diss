frr version 8.4
frr defaults traditional
hostname xpe6
log syslog informational
log file /var/log/frr/frr.log debugging
debug zebra evpn mh es
debug zebra vxlan
service integrated-vtysh-config

interface lo
 ip address 10.0.0.16/32
 ip ospf area 0.0.0.0
 ip ospf passive
!
interface eth1
 description to-xrr2
 ip address 10.1.15.1/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
!
interface vhost100
 evpn mh es-id 67
 evpn mh es-sys-mac 02:00:00:00:67:67
 evpn mh es-df-pref 50
!
router ospf
 ospf router-id 10.0.0.16
!
router bgp 65000
 bgp router-id 10.0.0.16
 timers bgp 10 30
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 !
 neighbor 10.0.0.2 remote-as 65000
 neighbor 10.0.0.2 update-source lo
 neighbor 10.0.0.2 description xrr2
 neighbor 10.0.0.2 bfd
 !
 address-family l2vpn evpn
  neighbor 10.0.0.2 activate
  advertise-all-vni
  vni 100
   route-target both 100:1
  exit-vni
 !
!
