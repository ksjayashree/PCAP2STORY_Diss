frr version 8.4
frr defaults traditional
hostname xrr2
log syslog informational
service integrated-vtysh-config

interface lo
 ip address 10.0.0.2/32
 ip ospf area 0.0.0.0
 ip ospf passive
!
interface eth1
 description to-xrr1
 ip address 10.1.1.1/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
!
interface eth2
 description to-xrr3
 ip address 10.1.13.2/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
!
interface eth3
 description to-xpe6
 ip address 10.1.15.2/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
!
interface eth4
 description to-xpe7
 ip address 10.1.16.2/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
!
interface eth6
 description to-xpe5
 ip address 10.1.11.2/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.0.0.2
!
router bgp 65000
 bgp router-id 10.0.0.2
 bgp cluster-id 2
 timers bgp 10 30
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 !
 neighbor PE-CLIENTS peer-group
 neighbor PE-CLIENTS remote-as 65000
 neighbor PE-CLIENTS update-source lo
 neighbor PE-CLIENTS bfd
 !
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 update-source lo
 neighbor 10.0.0.1 description xrr1
 !
 neighbor 10.0.0.3 remote-as 65000
 neighbor 10.0.0.3 update-source lo
 neighbor 10.0.0.3 description xrr3
 !
 neighbor 10.0.0.15 peer-group PE-CLIENTS
 neighbor 10.0.0.15 description xpe5
 neighbor 10.0.0.16 peer-group PE-CLIENTS
 neighbor 10.0.0.16 description xpe6
 neighbor 10.0.0.17 peer-group PE-CLIENTS
 neighbor 10.0.0.17 description xpe7
 !
 address-family l2vpn evpn
  neighbor PE-CLIENTS activate
  neighbor PE-CLIENTS route-reflector-client
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.3 activate
 !
!
