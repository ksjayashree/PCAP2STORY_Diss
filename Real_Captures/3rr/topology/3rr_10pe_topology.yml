name: pcap2story-3rr-dev

topology:
  nodes:
    xrr1:
      kind: linux
      image: quay.io/frrouting/frr:10.6.1
      binds:
        - configs/xrr1/frr.conf:/etc/frr/frr.conf
        - configs/xrr1/daemons:/etc/frr/daemons
        - configs/xrr1/vtysh.conf:/etc/frr/vtysh.conf
        - node_setup.sh:/etc/frr/node_setup.sh
        - start_no_watchfrr.sh:/etc/frr/start_no_watchfrr.sh
      cmd: bash /etc/frr/start_no_watchfrr.sh
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv6.conf.all.forwarding=1
        - sysctl -w net.ipv6.conf.all.disable_ipv6=0
        - bash /etc/frr/node_setup.sh

