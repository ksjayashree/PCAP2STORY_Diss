    xpe3-bond-stub:
      kind: linux
      image: quay.io/frrouting/frr:10.6.1
      cmd: sleep infinity

  links:
    # RR full mesh
    - endpoints: ["xrr1:eth1", "xrr2:eth1"]
    - endpoints: ["xrr1:eth6", "xrr3:eth1"]
    - endpoints: ["xrr2:eth2", "xrr3:eth2"]

    # xrr1 domain: xpe1, xpe2, xpe3, xpe4 (xpe3/xpe4 share an ESI)
    - endpoints: ["xpe1:eth1", "xrr1:eth2"]
    - endpoints: ["xpe2:eth1", "xrr1:eth3"]
    - endpoints: ["xpe3:eth1", "xrr1:eth4"]
    - endpoints: ["xpe4:eth1", "xrr1:eth5"]
    - endpoints: ["xpe3:eth2", "xpe3-bond-stub:eth1"]

    # xrr2 domain: xpe5, xpe6, xpe7 (xpe6/xpe7 share a separate ESI)
    - endpoints: ["xpe5:eth2", "xrr2:eth6"]
    - endpoints: ["xpe6:eth1", "xrr2:eth3"]
    - endpoints: ["xpe7:eth1", "xrr2:eth4"]

    # xrr3 domain: xpe8, xpe9, xpe10 (no ESI sharing)
    - endpoints: ["xpe8:eth1", "xrr3:eth3"]
    - endpoints: ["xpe9:eth1", "xrr3:eth4"]
    - endpoints: ["xpe10:eth1", "xrr3:eth5"]
