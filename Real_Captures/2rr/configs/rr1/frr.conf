frr version 10.6.1_git
frr defaults traditional
hostname rr1
domainname localdomain
log syslog informational
service integrated-vtysh-config
!
interface eth1
 description to-rr2
 ip address 10.1.1.2/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
exit
!
interface eth2
 description to-pe1
 ip address 10.1.2.2/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
exit
!
interface eth3
 description to-pe2
 ip address 10.1.4.2/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
exit
!
interface eth4
 description to-pe3
 ip address 10.1.6.2/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
exit
!
interface lo
 ip address 10.0.0.1/32
 ip ospf area 0.0.0.0
 ip ospf passive
exit
!
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 no bgp enforce-first-as
 no bgp default ipv4-unicast
 bgp cluster-id 0.0.0.1
 timers bgp 10 30
 neighbor PE-CLIENTS peer-group
 neighbor PE-CLIENTS remote-as 65000
 neighbor PE-CLIENTS bfd
 neighbor PE-CLIENTS update-source lo
 neighbor 10.0.0.11 peer-group PE-CLIENTS
 neighbor 10.0.0.11 description pe1
 neighbor 10.0.0.12 peer-group PE-CLIENTS
 neighbor 10.0.0.12 description pe2
 neighbor 10.0.0.13 peer-group PE-CLIENTS
 neighbor 10.0.0.13 description pe3
 neighbor 10.0.0.14 peer-group PE-CLIENTS
 neighbor 10.0.0.14 description pe4
 neighbor 10.0.0.15 peer-group PE-CLIENTS
 neighbor 10.0.0.15 description pe5
 neighbor 10.0.0.2 remote-as 65000
 neighbor 10.0.0.2 description rr2
 neighbor 10.0.0.2 update-source lo
 !
 address-family l2vpn evpn
  neighbor PE-CLIENTS activate
  neighbor PE-CLIENTS route-reflector-client
  neighbor 10.0.0.2 activate
 exit-address-family
exit
!
router ospf
 ospf router-id 10.0.0.1
exit
!
