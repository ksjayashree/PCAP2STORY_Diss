    - endpoints: ["rr1:eth1", "rr2:eth1"]
    - endpoints: ["pe1:eth1", "rr1:eth2"]
    - endpoints: ["pe2:eth1", "rr1:eth3"]
    - endpoints: ["pe3:eth1", "rr1:eth4"]
    - endpoints: ["pe4:eth2", "rr2:eth5"]
    - endpoints: ["pe5:eth2", "rr2:eth6"]
    - endpoints: ["pe1:eth2", "pe1-bond-stub:eth1"]
    - endpoints: ["pe2:eth2", "pe2-bond-stub:eth1"]
